  <style id="app-styles">
:root {
      --cell: 48px;
      --key-h: 50px;
      --keypad-w: 260px;
      --border: #444;
      --header-bg: #f3f5f7;
      --correct: #e8f7e8;
      --wrong: #ffeaea;
      --focus: #d62828;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background: #fafafa;
      color: #222;
      font-family: "M PLUS Rounded 1c", system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      overscroll-behavior: none;
    }

    .app {
      width: 100vw;
      height: 100svh;
      padding:
        max(14px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      overflow: hidden;
    }

    .header {
      min-width: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 3px;
      align-items: center;
      justify-items: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 30px);
      line-height: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 700;
      font-size: 14px;
    }

    select, button {
      font: inherit;
    }

    select {
      padding: 6px 8px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
    }

    button {
      border: 1px solid #bbb;
      border-radius: 8px;
      background: #fff;
      font-weight: 800;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .main-btn {
      padding: 7px 10px;
    }

    #startBtn {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      line-height: 1;
    }

    .status {
      min-height: 1.1em;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
    }

    /* ===== メイン領域 ===== */
    .work-area {
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: grid;
      align-items: center;
      justify-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 縦向き:
       [盤面]
       [テンキー] */
    @media (orientation: portrait) {
      .work-area {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
        row-gap: 12px;
        padding: 4px 0 10px;
      }

      .board-wrap {
        grid-column: 1;
        grid-row: 1;
      }

      .keypad {
        grid-column: 1;
        grid-row: 2;
        width: min(94%, 620px);
        justify-self: center;
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    /* 横向き:
       [盤面][テンキー] */
    @media (orientation: landscape) {
      .header {
        grid-template-columns: auto 1fr auto auto;
        gap: 8px;
        justify-items: stretch;
      }

      .header h1 {
        white-space: nowrap;
        font-size: clamp(16px, 2vw, 24px);
      }

      .controls {
        justify-content: center;
      }

      .timer {
        white-space: nowrap;
        font-size: clamp(20px, 2.5vw, 30px);
      }

      .status {
        white-space: nowrap;
        align-self: center;
      }

      .work-area {
        grid-template-columns: auto var(--keypad-w);
        grid-template-rows: minmax(0, 1fr);
        column-gap: 14px;
        padding: 8px 20px 10px;
        justify-content: center;
      }

      .board-wrap {
        grid-column: 1;
        grid-row: 1;
        width: auto;
        height: 100%;
      }

      .keypad {
        grid-column: 2;
        grid-row: 1;
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .board-wrap {
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    table {
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
      margin: 0;
    }

    th, td {
      width: var(--cell);
      min-width: var(--cell);
      max-width: var(--cell);
      height: var(--cell);
      min-height: var(--cell);
      max-height: var(--cell);
      padding: 0;
      border: 1px solid var(--border);
      text-align: center;
      position: relative;
    }

    th {
      background: var(--header-bg);
      font-weight: 900;
      font-size: clamp(12px, calc(var(--cell) * 0.38), 22px);
      user-select: none;
    }

    .corner {
      background: #222;
      color: #fff;
    }

    .answer {
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      text-align: center;
      font-size: clamp(12px, calc(var(--cell) * 0.40), 24px);
      font-weight: 800;
      caret-color: transparent;
      cursor: pointer;
    }

    td.focused::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 4px solid var(--focus);
      pointer-events: none;
      z-index: 5;
    }

    td.correct { background: var(--correct); }
    td.wrong { background: var(--wrong); }

    /* ===== テンキー ===== */
    .keypad {
      display: grid;
      gap: 5px;
      min-width: 0;
      align-content: center;
    }

    .key {
      width: 100%;
      min-width: 0;
      height: var(--key-h);
      min-height: 0;
      padding: 0;
      font-size: clamp(18px, 3vw, 28px);
      background: #fff;
    }

    .key:active {
      transform: translateY(1px);
      background: #eee;
    }

    .key-delete {
      grid-column: span 2;
      font-size: clamp(16px, 2.5vw, 22px);
    }

    .key[disabled] {
      opacity: .4;
    }

:root {
      --border: #6f6a92;
      --header-bg: #bfeeff;
      --correct: #dff8d8;
      --wrong: #ffe0e5;
      --focus: #ff3b5c;
    }

    html, body {
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 222, 89, .42), transparent 24%),
        radial-gradient(circle at 92% 10%, rgba(255, 146, 196, .32), transparent 24%),
        radial-gradient(circle at 10% 92%, rgba(118, 220, 255, .30), transparent 24%),
        linear-gradient(180deg, #fff9da 0%, #fff0f6 100%);
      color: #34334a;
    }

    .header {
      background: rgba(255,255,255,.76);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(70, 60, 110, .10);
    }

    h1 {
      color: #ff5f7e;
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 0 2px 0 rgba(255,255,255,.95);
    }

    label {
      color: #545184;
      font-weight: 800;
    }

    select {
      background: #ffffff;
      border-color: #9ed9ff;
      color: #3d4770;
      font-weight: 800;
      box-shadow: 0 2px 5px rgba(70, 80, 130, .08);
    }

    #startBtn {
      background: linear-gradient(180deg, #ffb44a 0%, #ff8b3d 100%);
      border-color: #ff8b3d;
      color: #fff;
      box-shadow: 0 3px 7px rgba(255, 139, 61, .22);
    }

    #pauseBtn {
      background: linear-gradient(180deg, #68d4ff 0%, #43b8f4 100%);
      border-color: #43b8f4;
      color: #fff;
      box-shadow: 0 3px 7px rgba(67, 184, 244, .18);
    }

    #pauseBtn:disabled {
      background: #d8e1ea;
      border-color: #c9d2db;
      color: #7b8590;
      box-shadow: none;
    }

    .timer {
      color: #5b59d9;
      text-shadow: 0 2px 0 rgba(255,255,255,.95);
    }

    .status {
      color: #7058a5;
      font-weight: 800;
    }

    table {
      box-shadow: 0 5px 16px rgba(70, 60, 110, .13);
    }

    th {
      background: linear-gradient(180deg, #d5f5ff 0%, #bceaff 100%);
      color: #304d73;
      font-size: clamp(15px, calc(var(--cell) * 0.44), 28px);
      font-weight: 900;
    }

    .corner {
      background: linear-gradient(180deg, #ff9f65 0%, #ff7b55 100%);
      color: #fff;
    }

    .answer {
      background: #fffef9;
      color: #393653;
      font-size: clamp(18px, calc(var(--cell) * 0.48), 34px);
      font-weight: 900;
    }

    td.correct .answer {
      background: #e5fbdc;
    }

    td.wrong .answer {
      background: #ffe3e8;
    }

    td.focused::after {
      border-color: #ff3b5c;
      box-shadow: 0 0 0 2px rgba(255,255,255,.9);
    }

    .key {
      color: #3d3b52;
      font-size: clamp(23px, 3.8vw, 35px);
      font-weight: 900;
      border-color: rgba(255,255,255,.9);
      box-shadow: 0 3px 7px rgba(70, 60, 110, .11);
    }

    .key:nth-child(1)  { background: #ffd29e; }
    .key:nth-child(2)  { background: #fff0a6; }
    .key:nth-child(3)  { background: #c8f3b8; }
    .key:nth-child(4)  { background: #b8edff; }
    .key:nth-child(5)  { background: #d3c8ff; }
    .key:nth-child(6)  { background: #ffcbee; }
    .key:nth-child(7)  { background: #ffc6d2; }
    .key:nth-child(8)  { background: #c9f1d6; }
    .key:nth-child(9)  { background: #ffe7a7; }
    .key:nth-child(10) { background: #cce6ff; }

    .key:active {
      filter: brightness(.96);
      transform: translateY(1px) scale(.98);
    }

    .key[disabled] {
      opacity: .42;
      filter: saturate(.5);
    }

    .key-delete {
      background: linear-gradient(180deg, #ff9bb1 0%, #ff7895 100%) !important;
    }

    /* CSS-only eraser illustration. No external image and no layout-size changes. */
    .eraser {
      display: inline-block;
      width: min(54%, 58px);
      aspect-ratio: 1.9 / 1;
      position: relative;
      vertical-align: middle;
      border: 2px solid rgba(89, 71, 82, .40);
      border-radius: 7px;
      background:
        linear-gradient(135deg,
          #ffb1c5 0 55%,
          #fff0b8 55% 100%);
      transform: rotate(-10deg);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.45),
        0 2px 4px rgba(80,60,80,.14);
    }

    .eraser::after {
      content: "";
      position: absolute;
      top: 8%;
      bottom: 8%;
      right: 27%;
      width: 2px;
      background: rgba(89, 71, 82, .24);
    }

/* Header contents may wrap instead of overflowing. */
    .header {
      min-width: 0;
      overflow: hidden;
    }

    .controls {
      width: 100%;
      min-width: 0;
      flex-wrap: wrap;
      justify-content: center;
      white-space: normal;
      row-gap: 6px;
      column-gap: 8px;
    }

    .controls label,
    .controls button {
      flex: 0 0 auto;
      max-width: 100%;
    }

    .timer,
    .status {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* In landscape, keep the header compact but allow items to drop rows if needed. */
    @media (orientation: landscape) {
      .header {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .header h1,
      .timer,
      .status {
        white-space: normal;
        text-align: center;
      }

      .controls {
        justify-content: center;
      }
    }

    /* Thin border around all keypad buttons. */
    .key {
      border: 1px solid rgba(72, 72, 95, .38) !important;
    }

    .key-delete {
      border: 1px solid rgba(120, 65, 80, .42) !important;
    }

.header {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 14px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .controls {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    .controls label,
    .controls .main-btn {
      min-width: 0;
      box-sizing: border-box;
    }

    /* 縦向き
       [マス選択][計算選択]
       [スタート][一時停止]
       [タイマー]
    */
    @media (orientation: portrait) {
      .header {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        justify-items: center;
      }

      .header h1 {
        margin-bottom: 2px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 10px;
        max-width: 620px;
        justify-items: stretch;
        align-items: center;
      }

      .controls label {
        width: 100%;
        justify-content: center;
      }

      .controls label select {
        min-width: 0;
        max-width: 100%;
      }

      #startBtn,
      #pauseBtn {
        width: 100%;
      }

      .timer {
        grid-column: 1 / -1;
        width: 100%;
        text-align: center;
        margin-top: 2px;
      }

      .status {
        width: 100%;
        text-align: center;
      }
    }

    /* 横向き
       [マス選択][計算選択][スタート][一時停止][タイマー]
    */
    @media (orientation: landscape) {
      .header {
        display: grid;
        grid-template-columns: auto;
        justify-items: center;
        gap: 6px;
        padding: 8px 16px;
      }

      .header h1 {
        margin-bottom: 1px;
      }

      .controls {
        display: flex;
        flex-wrap: nowrap;
        width: auto;
        max-width: calc(100vw - 48px);
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .controls label,
      .controls .main-btn {
        flex: 0 0 auto;
      }

      .timer {
        width: auto;
        min-width: 150px;
        text-align: center;
        margin-left: 4px;
      }

      .status {
        width: 100%;
        text-align: center;
      }
    }

    @media (orientation: landscape) and (max-width: 900px) {
      .controls {
        gap: 6px;
      }

      .controls label {
        font-size: 13px;
      }

      select {
        padding: 6px 7px;
      }

      .main-btn {
        padding: 7px 9px;
      }

      .timer {
        min-width: 128px;
        font-size: clamp(22px, 3vw, 30px);
      }
    }

html, body,
    button, select, input, textarea {
      font-family: "M PLUS Rounded 1c", system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

/* テンキー間隔を少し広げる */
    .keypad {
      gap: 7px;
    }

    /* フォーカス中の縦横見出し */
    th.active-header {
      background: linear-gradient(180deg, #fff2a6 0%, #ffd96b 100%) !important;
      color: #5b4718 !important;
      box-shadow: inset 0 0 0 2px rgba(255, 166, 0, .55);
    }

    /* 誤答時の短い揺れ。レイアウト寸法は変えない */
    td.wrong-flash {
      animation: wrongShake .28s ease-in-out;
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* カウントダウン・完了演出は fixed overlay なので既存レイアウトに影響しない */
    .screen-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .48);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      pointer-events: none;
    }

    .screen-overlay[hidden] {
      display: none;
    }

    .countdown-text {
      font-size: clamp(88px, 22vw, 210px);
      font-weight: 900;
      line-height: 1;
      color: #ff5f7e;
      text-shadow:
        0 5px 0 #fff,
        0 9px 18px rgba(90, 70, 120, .18);
      animation: countdownPop .72s ease both;
    }

    @keyframes countdownPop {
      0%   { transform: scale(.45); opacity: 0; }
      38%  { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebration-overlay {
      background: rgba(255, 248, 224, .62);
    }

    .celebration-card {
      position: relative;
      z-index: 2;
      min-width: min(78vw, 420px);
      padding: 26px 34px;
      text-align: center;
      background: rgba(255,255,255,.94);
      border: 4px solid #fff;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(80, 60, 120, .20);
      animation: finishPop .42s cubic-bezier(.2,.9,.3,1.25) both;
    }

    .celebration-title {
      font-size: clamp(42px, 9vw, 82px);
      font-weight: 900;
      color: #ff5f7e;
      line-height: 1;
    }

    .celebration-time {
      margin-top: 12px;
      font-size: clamp(30px, 6vw, 54px);
      font-weight: 900;
      color: #5b59d9;
      font-variant-numeric: tabular-nums;
    }

    .celebration-best {
      min-height: 1.2em;
      margin-top: 8px;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 900;
      color: #ff9a2f;
    }

    @keyframes finishPop {
      from { transform: scale(.68) rotate(-2deg); opacity: 0; }
      to   { transform: scale(1) rotate(0); opacity: 1; }
    }

    .confetti-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      top: -12vh;
      width: 11px;
      height: 20px;
      border-radius: 3px;
      opacity: .92;
      animation: confettiFall var(--duration) linear var(--delay) forwards;
      transform: rotate(var(--rotate));
    }

    @keyframes confettiFall {
      to {
        transform:
          translate3d(var(--drift), 120vh, 0)
          rotate(calc(var(--rotate) + 720deg));
      }
    }

.countdown-text {
      width: 100%;
      max-width: 100vw;
      text-align: center;
      white-space: nowrap;
      transform-origin: 50% 50%;
      justify-self: stretch;
    }

.player-tools {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 8px;
    }

    .player-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
    }

    #playerSelect {
      min-width: 110px;
      max-width: 180px;
    }

    .mini-btn {
      padding: 6px 10px;
      border-radius: 11px;
      font-size: 13px;
      white-space: nowrap;
    }

    .records-btn {
      background: linear-gradient(180deg, #ffe783, #ffd255);
      border-color: #e0b73f;
      color: #5c4610;
    }

    @media (orientation: landscape) {
      .player-tools {
        gap: 5px 7px;
      }

      .mini-btn {
        padding: 5px 9px;
        font-size: 12px;
      }
    }

    .celebration-rank {
      min-height: 1.2em;
      margin-top: 6px;
      font-size: clamp(17px, 2.8vw, 25px);
      font-weight: 900;
      color: #5b59d9;
    }

    .app-modal {
      position: fixed;
      inset: 0;
      z-index: 1400;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(49, 43, 72, .38);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .app-modal[hidden] {
      display: none;
    }

    .modal-panel {
      width: min(92vw, 680px);
      max-height: min(88svh, 760px);
      overflow: hidden;
      background: #fffdf8;
      border: 4px solid #fff;
      border-radius: 24px;
      box-shadow: 0 16px 48px rgba(60, 45, 90, .25);
      color: #38354e;
    }

    .name-panel {
      width: min(90vw, 420px);
      padding: 24px;
    }

    .modal-title {
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.1;
      font-weight: 900;
      color: #ff5f7e;
    }

    .name-input {
      width: 100%;
      margin-top: 18px;
      padding: 12px 14px;
      border: 2px solid #b9dff8;
      border-radius: 14px;
      outline: none;
      background: #fff;

<body>
  <main class="app">
    <header class="header">
      <h1 class="app-title"><img class="title-logo" src="./title-logo-v2.png" alt="100マス計算"></h1>

      <div class="controls">
        <label>
          マス：
          <select id="gridSize">
            <option value="5">5 × 5</option>
            <option value="7">7 × 7</option>
            <option value="10" selected>10 × 10</option>
          </select>
        </label>

        <label>
          計算：
          <select id="operation">
            <option value="+">たし算</option>
            <option value="-">ひき算</option>
            <option value="*">かけ算</option>
          </select>
        </label>

        <button id="startBtn" class="main-btn" type="button">スタート</button>
        <button id="pauseBtn" class="main-btn" type="button" disabled>一時停止</button>

      <div class="player-tools">
        <label class="player-label">
          なまえ：
          <select id="playerSelect" aria-label="プレイヤー名"></select>
        </label>
        <button id="addPlayerBtn" class="mini-btn" type="button">👤 なまえ</button>
        <button id="recordsBtn" class="mini-btn records-btn" type="button">🏆 きろく</button>
      </div>
    </header>

    <section class="work-area">
      <div class="board-wrap">
        <table id="board" aria-label="マス計算">
          <tbody></tbody>
        </table>
      </div>

      <div id="keypad" class="keypad" aria-label="数字入力">
        <button class="key" data-key="1" type="button">1</button>
        <button class="key" data-key="2" type="button">2</button>
        <button class="key" data-key="3" type="button">3</button>
        <button class="key" data-key="4" type="button">4</button>
        <button class="key" data-key="5" type="button">5</button>
        <button class="key" data-key="6" type="button">6</button>
        <button class="key" data-key="7" type="button">7</button>
        <button class="key" data-key="8" type="button">8</button>
        <button class="key" data-key="9" type="button">9</button>
        <button class="key" data-key="0" type="button">0</button>

          <button id="clearRecordsBtn" class="danger-mini-btn" type="button">この条件を消す</button>
        </div>

  <script>
    const board = document.querySelector("#board tbody");
    const startBtn = document.querySelector("#startBtn");
    const pauseBtn = document.querySelector("#pauseBtn");
    const timerEl = document.querySelector("#timer");
    const statusEl = document.querySelector("#status");
    const operationEl = document.querySelector("#operation");
    const gridSizeEl = document.querySelector("#gridSize");
    const keypad = document.querySelector("#keypad");
    const workArea = document.querySelector(".work-area");
    const countdownOverlay = document.querySelector("#countdownOverlay");
    const countdownText = document.querySelector("#countdownText");
    const celebrationOverlay = document.querySelector("#celebrationOverlay");
    const celebrationTime = document.querySelector("#celebrationTime");
    const celebrationBest = document.querySelector("#celebrationBest");
    const celebrationRank = document.querySelector("#celebrationRank");
    const confettiLayer = document.querySelector("#confettiLayer");

    const playerSelect = document.querySelector("#playerSelect");
    const addPlayerBtn = document.querySelector("#addPlayerBtn");
    const recordsBtn = document.querySelector("#recordsBtn");

    const nameModal = document.querySelector("#nameModal");
    const playerManageList = document.querySelector("#playerManageList");
    const newPlayerName = document.querySelector("#newPlayerName");
    const cancelNameBtn = document.querySelector("#cancelNameBtn");
    const saveNameBtn = document.querySelector("#saveNameBtn");

    const recordsModal = document.querySelector("#recordsModal");
    const closeRecordsBtn = document.querySelector("#closeRecordsBtn");
    const recordsCondition = document.querySelector("#recordsCondition");
    const rankingList = document.querySelector("#rankingList");
    const historyList = document.querySelector("#historyList");
    const clearRecordsBtn = document.querySelector("#clearRecordsBtn");

    let rowNumbers = [];
    let colNumbers = [];
    let activeInput = null;

    let startedAt = 0;
    let elapsedBeforePause = 0;
    let timerId = null;
    let countdownTimer = null;
    let running = false;
    let paused = false;
    let countingDown = false;
    let correctCount = 0;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createHeaders(size) {
      if (size === 10) {
        return shuffle(Array.from({ length: 10 }, (_, i) => i + 1));
      }
      return shuffle(Array.from({ length: 9 }, (_, i) => i + 1)).slice(0, size);
    }

    function calc(a, b) {
      switch (operationEl.value) {
        case "-": return Math.abs(a - b);
        case "*": return a * b;
        default: return a + b;
      }
    }

    function operationMark() {
      switch (operationEl.value) {
        case "-": return "−";
        case "*": return "×";
        default: return "＋";
      }
    }

    function formatTime(ms) {
      const totalHundredths = Math.floor(ms / 10);
      const minutes = Math.floor(totalHundredths / 6000);
      const seconds = Math.floor((totalHundredths % 6000) / 100);
      const hundredths = totalHundredths % 100;

      return String(minutes).padStart(2, "0") + ":" +
             String(seconds).padStart(2, "0") + "." +
             String(hundredths).padStart(2, "0");
    }


    function totalQuestions() {
      const size = Number(gridSizeEl.value);
      return size * size;
    }

    const STORAGE_KEY = "masu-keisan-data-v2";
    const LEGACY_STORAGE_KEY = "masu-keisan-data-v1";
    const MAX_HISTORY = 50;

    function normalizeRecord(record) {
      if (!record || typeof record.name !== "string") return null;

      const size = Number(record.size);
      const time = Number(record.time);
      const operation = String(record.operation || "");

      if (!Number.isFinite(size) || !Number.isFinite(time)) return null;
      if (!["+", "-", "*"].includes(operation)) return null;

      return {
        id: typeof record.id === "string" ? record.id : "",
        name: record.name.trim() || "ゲスト",
        size,
        operation,
        time: Math.max(0, Math.round(time)),
        date: typeof record.date === "string" ? record.date : ""
      };
    }

    function bestRecordKey(record) {
      return `${record.name}\u0000${record.size}\u0000${record.operation}`;
    }

    function mergeBestRecords(...recordGroups) {
      const bestMap = new Map();

      recordGroups.flat().forEach(raw => {
        const record = normalizeRecord(raw);
        if (!record) return;

        const key = bestRecordKey(record);
        const old = bestMap.get(key);
        if (!old || record.time < old.time) {
          bestMap.set(key, record);
        }
      });

      return [...bestMap.values()];
    }

    function loadAppData() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY) ||
          localStorage.getItem(LEGACY_STORAGE_KEY);

        if (!raw) {
          return {
            players: ["ゲスト"],
            currentPlayer: "ゲスト",
            records: [],
            bestRecords: []
          };
        }

        const parsed = JSON.parse(raw);
        const players = Array.isArray(parsed.players) && parsed.players.length
          ? parsed.players
              .filter(v => typeof v === "string" && v.trim())
              .map(v => v.trim())
          : ["ゲスト"];

        // Migration note:
        // v1 used records for both history and rankings.  Derive permanent bests
        // from every record still available before trimming recent history.
        const allRecords = Array.isArray(parsed.records)
          ? parsed.records.map(normalizeRecord).filter(Boolean)
          : [];

        const storedBests = Array.isArray(parsed.bestRecords)
          ? parsed.bestRecords.map(normalizeRecord).filter(Boolean)
          : [];

        const bestRecords = mergeBestRecords(storedBests, allRecords);
        const records = allRecords.slice(0, MAX_HISTORY);

        const currentPlayer =
          typeof parsed.currentPlayer === "string" &&
          players.includes(parsed.currentPlayer)
            ? parsed.currentPlayer
            : players[0];

        return { players, currentPlayer, records, bestRecords };
      } catch {
        return {
          players: ["ゲスト"],
          currentPlayer: "ゲスト",
          records: [],
          bestRecords: []
        };
      }
    }

    let appData = loadAppData();

    function saveAppData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // Persist migrated v1 data immediately under the v2 key.
    saveAppData();

    function currentPlayerName() {
      return appData.currentPlayer || "ゲスト";
    }

    function renderPlayerSelect() {
      playerSelect.innerHTML = "";

      appData.players.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        playerSelect.appendChild(option);
      });

      if (!appData.players.includes(appData.currentPlayer)) {
        appData.currentPlayer = appData.players[0] || "ゲスト";
      }

      playerSelect.value = appData.currentPlayer;
    }

    function conditionMatches(record) {
      return Number(record.size) === Number(gridSizeEl.value) &&
             record.operation === operationEl.value;
    }

    function currentConditionRecords() {
      return appData.records.filter(conditionMatches);
    }

    function currentConditionBestRecords() {
      return appData.bestRecords.filter(conditionMatches);
    }

    function getPersonalBest(name = currentPlayerName()) {
      const best = currentConditionBestRecords().find(
        record => record.name === name
      );
      return best ? Number(best.time) : null;
    }

    function getRanking() {
      return currentConditionBestRecords()
        .map(record => ({
          name: record.name,
          time: Number(record.time)
        }))
        .filter(item => Number.isFinite(item.time))
        .sort((a, b) => a.time - b.time);
    }

    function getCurrentRank() {
      const ranking = getRanking();
      const index = ranking.findIndex(item => item.name === currentPlayerName());
      return index >= 0 ? index + 1 : null;
    }

    function addRecord(ms) {
      const record = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
        name: currentPlayerName(),
        size: Number(gridSizeEl.value),
        operation: operationEl.value,
        time: Math.round(ms),
        date: new Date().toISOString()
      };

      const previousBest = getPersonalBest(record.name);
      const bestIndex = appData.bestRecords.findIndex(best =>
        best.name === record.name &&
        Number(best.size) === record.size &&
        best.operation === record.operation
      );

      const isPersonalBest =
        bestIndex < 0 || record.time < Number(appData.bestRecords[bestIndex].time);

      if (isPersonalBest) {
        const bestRecord = { ...record };
        if (bestIndex < 0) {
          appData.bestRecords.push(bestRecord);
        } else {
          appData.bestRecords[bestIndex] = bestRecord;
        }
      }

      appData.records.unshift(record);
      appData.records = appData.records.slice(0, MAX_HISTORY);
      saveAppData();

      const personalBest = getPersonalBest(record.name);
      const rank = getCurrentRank();

      return {
        record,
        isPersonalBest: previousBest === null || record.time < previousBest,
        rank,
        personalBest
      };
    }

    function bestLabel() {
      const best = getPersonalBest();
      return best === null ? "" : `　ベスト ${formatTime(best)}`;
    }

    function updateProgressStatus(prefix = "") {
      const progress = `${correctCount} / ${totalQuestions()}`;
      statusEl.textContent =
        `${prefix}${currentPlayerName()}　${progress}${bestLabel()}`;
    }

    function operationLabel(op = operationEl.value) {
      if (op === "-") return "ひき算";
      if (op === "*") return "かけ算";
      return "たし算";
    }

    function formatRecordDate(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";

      return new Intl.DateTimeFormat("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d);
    }

    function renderRecordsModal() {
      recordsCondition.textContent =
        `${gridSizeEl.value}×${gridSizeEl.value}　${operationLabel()}`;

      const top5 = getRanking().slice(0, 5);
      rankingList.innerHTML = "";

      if (!top5.length) {
        rankingList.innerHTML =
          '<div class="empty-state">まだきろくがありません</div>';
      } else {
        top5.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = `ranking-row rank-${index + 1}`;
          row.innerHTML = `
            <div class="rank-no">${index + 1}位</div>
            <div class="rank-name"></div>
            <div class="rank-time">${formatTime(item.time)}</div>
          `;
          row.querySelector(".rank-name").textContent = item.name;
          rankingList.appendChild(row);
        });
      }

      const recent = currentConditionRecords();
      historyList.innerHTML = "";

      if (!recent.length) {
        historyList.innerHTML =
          '<div class="empty-state">まだりれきがありません</div>';
      } else {
        recent.forEach(record => {
          const row = document.createElement("div");
          row.className = "history-row";

          const main = document.createElement("div");
          main.className = "history-main";

          const name = document.createElement("div");
          name.className = "history-name";
          name.textContent = record.name;

          const date = document.createElement("div");
          date.className = "history-date";
          date.textContent = formatRecordDate(record.date);

          main.append(name, date);

          const time = document.createElement("div");
          time.className = "history-time";
          time.textContent = formatTime(record.time);

          const del = document.createElement("button");
          del.type = "button";
          del.className = "delete-record-btn";
          del.dataset.recordId = record.id;
          del.setAttribute("aria-label", "この記録を削除");
          del.textContent = "×";

          row.append(main, time, del);
          historyList.appendChild(row);
        });
      }
    }

    function openRecordsModal() {
      renderRecordsModal();
      recordsModal.hidden = false;
    }

    function closeRecordsModal() {
      recordsModal.hidden = true;
    }

    function renderPlayerManager() {
      playerManageList.innerHTML = "";

      appData.players.forEach(name => {
        const row = document.createElement("div");
        row.className = "player-manage-row";

        const choose = document.createElement("button");
        choose.type = "button";
        choose.className = "player-choice-btn";
        if (name === currentPlayerName()) {
          choose.classList.add("current");
        }
        choose.dataset.playerName = name;
        choose.textContent = name;

        const del = document.createElement("button");
        del.type = "button";
        del.className = "player-delete-btn";
        del.dataset.deletePlayer = name;
        del.setAttribute("aria-label", `${name}を削除`);
        del.textContent = "🗑";
        del.disabled = name === "ゲスト";

        row.append(choose, del);
        playerManageList.appendChild(row);
      });
    }

    function refreshPlayerStatus() {
      if (!running && !countingDown) {
        statusEl.textContent =
          `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
      } else if (running && !paused) {
        updateProgressStatus();
      }
    }

    function selectPlayer(name) {
      if (!appData.players.includes(name)) return;

      appData.currentPlayer = name;
      saveAppData();
      renderPlayerSelect();
      renderPlayerManager();
      refreshPlayerStatus();
    }

    function deletePlayer(name) {
      if (name === "ゲスト" || !appData.players.includes(name)) return;

      const ok = confirm(
        `「${name}」を消しますか？\nこの名前の記録もすべて消えます。`
      );
      if (!ok) return;

      appData.players = appData.players.filter(player => player !== name);
      appData.records = appData.records.filter(record => record.name !== name);
      appData.bestRecords = appData.bestRecords.filter(record => record.name !== name);

      if (appData.currentPlayer === name) {
        appData.currentPlayer = "ゲスト";
      }

      if (!appData.players.includes("ゲスト")) {
        appData.players.unshift("ゲスト");
      }

      saveAppData();
      renderPlayerSelect();
      renderPlayerManager();
      refreshPlayerStatus();
    }

    function openNameModal() {
      newPlayerName.value = "";
      renderPlayerManager();
      nameModal.hidden = false;
    }

    function closeNameModal() {
      nameModal.hidden = true;
      newPlayerName.blur();
    }

    function registerPlayer() {
      const name = newPlayerName.value.trim().replace(/\s+/g, " ");
      if (!name) {
        newPlayerName.focus();
        return;
      }

      if (!appData.players.includes(name)) {
        appData.players.push(name);
      }

      appData.currentPlayer = name;
      saveAppData();
      renderPlayerSelect();
      renderPlayerManager();
      newPlayerName.value = "";
      refreshPlayerStatus();
    }

    function clearHeaderHighlights() {
      document.querySelectorAll("th.active-header").forEach(th => {
        th.classList.remove("active-header");
      });
    }

    function updateHeaderHighlights(input) {
      clearHeaderHighlights();
      if (!input) return;

      const row = Number(input.dataset.row);
      const col = Number(input.dataset.col);

      const rowHeader = board.querySelector(`th[data-row-header="${row}"]`);
      const colHeader = board.querySelector(`th[data-col-header="${col}"]`);

      if (rowHeader) rowHeader.classList.add("active-header");
      if (colHeader) colHeader.classList.add("active-header");
    }

    function clearConfetti() {
      confettiLayer.innerHTML = "";
    }

    function createConfetti() {
      clearConfetti();
      const colors = ["#ff6b8a", "#ffd54f", "#6bdcff", "#8ee38b", "#a99bff", "#ff9d4d"];

      for (let i = 0; i < 42; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--duration", `${1.6 + Math.random() * 1.2}s`);
        piece.style.setProperty("--delay", `${Math.random() * .35}s`);
        piece.style.setProperty("--drift", `${-70 + Math.random() * 140}px`);
        piece.style.setProperty("--rotate", `${Math.random() * 360}deg`);
        confettiLayer.appendChild(piece);
      }
    }

    function hideCelebration() {
      celebrationOverlay.hidden = true;
      clearConfetti();
    }

    function showCelebration(elapsed, isNewBest, rank) {
      celebrationTime.textContent = formatTime(elapsed);
      celebrationBest.textContent = isNewBest ? "★ じこベスト！ ★" : "";
      celebrationRank.textContent =
        rank && rank <= 5 ? `🏆 ランキング ${rank}位` : "";

      createConfetti();
      celebrationOverlay.hidden = false;

      setTimeout(() => {
        celebrationOverlay.hidden = true;
        clearConfetti();
      }, 2800);
    }

    function stopCountdown() {
      if (countdownTimer !== null) {
        clearTimeout(countdownTimer);
        countdownTimer = null;
      }
      countingDown = false;
      countdownOverlay.hidden = true;
    }

    function runCountdown(onDone) {
      stopCountdown();
      countingDown = true;
      countdownOverlay.hidden = false;

      const steps = ["3", "2", "1", "スタート！"];
      let index = 0;

      const showStep = () => {
        countdownText.textContent = steps[index];
        countdownText.style.animation = "none";
        void countdownText.offsetWidth;
        countdownText.style.animation = "countdownPop .72s ease both";

        const isLast = index === steps.length - 1;
        const delay = isLast ? 420 : 720;

        countdownTimer = setTimeout(() => {
          index++;
          if (index < steps.length) {
            showStep();
          } else {
            countdownTimer = null;
            countingDown = false;
            countdownOverlay.hidden = true;
            onDone();
          }
        }, delay);
      };

      showStep();
    }

    function getElapsedTime() {
      if (running && !paused) {
        return elapsedBeforePause + (performance.now() - startedAt);
      }
      return elapsedBeforePause;
    }

    function updateTimer() {
      if (!running || paused) return;
      timerEl.textContent = formatTime(getElapsedTime());
      timerId = requestAnimationFrame(updateTimer);
    }

    function setKeypadEnabled(enabled) {
      keypad.querySelectorAll("button").forEach(btn => {
        btn.disabled = !enabled;
      });
    }
    function setPlayerControlsEnabled(enabled) {
      playerSelect.disabled = !enabled;
      addPlayerBtn.disabled = !enabled;
      recordsBtn.disabled = !enabled;
    }


    function clearFocusFrame() {
      document.querySelectorAll("td.focused").forEach(td => {
        td.classList.remove("focused");
      });
      clearHeaderHighlights();
    }

    function setActiveInput(input) {
      if (!running || paused || !input) return;

      activeInput = input;
      clearFocusFrame();
      input.parentElement.classList.add("focused");
      updateHeaderHighlights(input);

      try {
        input.focus({ preventScroll: true });
      } catch {
        input.focus();
      }
    }

    function buildBoard() {
      board.classList.remove("problem-numbers-hidden");
      board.innerHTML = "";
      activeInput = null;

      const topRow = document.createElement("tr");
      const corner = document.createElement("th");
      corner.className = "corner";
      corner.textContent = operationMark();
      topRow.appendChild(corner);

      colNumbers.forEach((num, c) => {
        const th = document.createElement("th");
        th.textContent = num;
        th.dataset.colHeader = c;
        topRow.appendChild(th);
      });
      board.appendChild(topRow);

      rowNumbers.forEach((rowNum, r) => {
        const tr = document.createElement("tr");

        const rowHeader = document.createElement("th");
        rowHeader.textContent = rowNum;
        rowHeader.dataset.rowHeader = r;
        tr.appendChild(rowHeader);

        colNumbers.forEach((colNum, c) => {
          const td = document.createElement("td");
          const input = document.createElement("input");

          input.type = "text";
          input.className = "answer";
          input.readOnly = true;
          input.inputMode = "none";
          input.tabIndex = -1;
          input.dataset.correct = calc(rowNum, colNum);
          input.dataset.row = r;
          input.dataset.col = c;
          input.disabled = !running || paused || countingDown;

          input.addEventListener("pointerdown", event => {
            event.preventDefault();
            setActiveInput(input);
          });

          td.appendChild(input);
          tr.appendChild(td);
        });

        board.appendChild(tr);
      });

      scheduleLayout();
    }

    function getInputs() {
      return [...document.querySelectorAll(".answer")];
    }

    function getCorrectCount() {
      return getInputs().reduce((count, input) => {
        const isCorrect =
          input.value !== "" &&
          Number(input.value) === Number(input.dataset.correct);
        return count + (isCorrect ? 1 : 0);
      }, 0);
    }

    function syncCorrectCount() {
      correctCount = getCorrectCount();
      return correctCount;
    }

    function focusNextInput(current) {
      const inputs = getInputs();
      const index = inputs.indexOf(current);

      if (index >= 0 && index < inputs.length - 1) {
        setActiveInput(inputs[index + 1]);
      }
    }

    function refreshCellState(input) {
      const td = input.parentElement;

      if (input.value === "") {
        td.classList.remove("correct", "wrong", "wrong-flash");
        return "empty";
      }

      const correctText = String(input.dataset.correct);
      const valueText = input.value;
      const isCorrect = valueText === correctText;
      const isPossiblePrefix =
        correctText.startsWith(valueText) && valueText.length < correctText.length;

      if (isCorrect) {
        td.classList.add("correct");
        td.classList.remove("wrong", "wrong-flash");
        return "correct";
      }

      if (isPossiblePrefix) {
        td.classList.remove("correct", "wrong", "wrong-flash");
        return "prefix";
      }

      td.classList.remove("correct");
      td.classList.add("wrong", "wrong-flash");
      return "wrong";
    }

    function appendDigit(digit) {
      if (!running || paused || countingDown || !activeInput) return;
      if (activeInput.value.length >= 3) return;

      const target = activeInput;
      target.value += digit;
      const state = refreshCellState(target);

      // Progress always reflects the real board, never an accumulated counter.
      syncCorrectCount();
      updateProgressStatus();

      if (state === "correct") {
        const current = target;
        checkAllCorrect();

        if (running && !paused) {
          focusNextInput(current);
        }
        return;
      }

      if (state === "wrong") {
        const wrongValue = target.value;

        setTimeout(() => {
          if (!running || paused) return;
          if (target.value !== wrongValue) return;

          target.value = "";
          target.parentElement.classList.remove("wrong", "wrong-flash");
          syncCorrectCount();
          updateProgressStatus();

          if (activeInput === target) {
            setActiveInput(target);
          }
        }, 320);
      }
    }

    function deleteDigit() {
      if (!running || paused || countingDown || !activeInput) return;

      activeInput.value = activeInput.value.slice(0, -1);
      refreshCellState(activeInput);
      syncCorrectCount();
      updateProgressStatus();
    }

    function checkAllCorrect() {
      if (!running) return;

      const inputs = getInputs();
      const allCorrect =
        inputs.length === totalQuestions() &&
        inputs.every(input =>
          input.value !== "" &&
          Number(input.value) === Number(input.dataset.correct)
        );

      if (!allCorrect) {
        syncCorrectCount();
        return;
      }

      correctCount = inputs.length;
      elapsedBeforePause = getElapsedTime();
      running = false;
      paused = false;
      cancelAnimationFrame(timerId);

      const result = addRecord(elapsedBeforePause);

      timerEl.textContent = formatTime(elapsedBeforePause);
      statusEl.textContent =
        `全問正解！　${currentPlayerName()}　${correctCount} / ${totalQuestions()}${bestLabel()}`;

      inputs.forEach(input => input.disabled = true);
      clearFocusFrame();
      activeInput = null;

      startBtn.textContent = "もう一度";
      startBtn.disabled = false;
      pauseBtn.textContent = "一時停止";
      pauseBtn.disabled = true;
      setKeypadEnabled(false);
      setPlayerControlsEnabled(true);

      showCelebration(
        elapsedBeforePause,
        result.isPersonalBest,
        result.rank
      );
    }

    function resetGame() {
      cancelAnimationFrame(timerId);
      stopCountdown();
      hideCelebration();

      running = false;
      paused = false;
      elapsedBeforePause = 0;
      startedAt = 0;
      activeInput = null;
      correctCount = 0;

      timerEl.textContent = "00:00.00";
      statusEl.textContent =
        `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
      startBtn.textContent = "スタート";
      startBtn.disabled = false;
      pauseBtn.textContent = "一時停止";
      pauseBtn.disabled = true;

      clearFocusFrame();
      setKeypadEnabled(false);
      setPlayerControlsEnabled(true);

      const size = Number(gridSizeEl.value);
      rowNumbers = createHeaders(size);
      colNumbers = createHeaders(size);
      buildBoard();
    }

    function startGame() {
      cancelAnimationFrame(timerId);
      stopCountdown();
      hideCelebration();

      const size = Number(gridSizeEl.value);
      rowNumbers = createHeaders(size);
      colNumbers = createHeaders(size);

      elapsedBeforePause = 0;
      correctCount = 0;
      running = false;
      paused = false;
      countingDown = true;

      timerEl.textContent = "00:00.00";
      statusEl.textContent =
        `じゅんび…　${currentPlayerName()}　0 / ${totalQuestions()}${bestLabel()}`;
      startBtn.textContent = "やり直す";
      startBtn.disabled = true;
      pauseBtn.textContent = "一時停止";
      pauseBtn.disabled = true;

      buildBoard();
      board.classList.add("problem-numbers-hidden");
      setKeypadEnabled(false);
      setPlayerControlsEnabled(false);

      runCountdown(() => {
        running = true;
        paused = false;
        countingDown = false;

        // Reveal the randomized row/column numbers exactly when play begins.
        board.classList.remove("problem-numbers-hidden");

        startBtn.disabled = false;
        pauseBtn.disabled = false;

        getInputs().forEach(input => input.disabled = false);
        setKeypadEnabled(true);

        startedAt = performance.now();
        updateProgressStatus();
        updateTimer();

        requestAnimationFrame(() => {
          const first = document.querySelector(".answer");
          if (first) setActiveInput(first);
        });
      });
    }

    function togglePause() {
      if (!running) return;

      const inputs = getInputs();

      if (!paused) {
        elapsedBeforePause = getElapsedTime();
        paused = true;
        cancelAnimationFrame(timerId);

        timerEl.textContent = formatTime(elapsedBeforePause);
        updateProgressStatus("一時停止中　");
        pauseBtn.textContent = "再開";

        inputs.forEach(input => input.disabled = true);
        clearFocusFrame();
        setKeypadEnabled(false);
      } else {
        paused = false;
        startedAt = performance.now();

        updateProgressStatus();
        pauseBtn.textContent = "一時停止";

        inputs.forEach(input => input.disabled = false);
        setKeypadEnabled(true);
        updateTimer();

        const next =
          inputs.find(input =>
            input.value === "" ||
            Number(input.value) !== Number(input.dataset.correct)
          ) || inputs[0];

        setActiveInput(next);
      }
    }

    function layout() {
      const size = Number(gridSizeEl.value);
      const cells = size + 1;
      const landscape = matchMedia("(orientation: landscape)").matches;
      const smartphoneLandscape =
        landscape && matchMedia("(max-height: 600px)").matches;

      const w = workArea.clientWidth;
      const h = workArea.clientHeight;
      if (!w || !h) return;

      let boardW, boardH, keyH;

      if (smartphoneLandscape) {
        // スマホ横向き:
        // [ヘッダー][盤面][テンキー] の3カラム。
        const viewportW = window.innerWidth;
        const headerW = Math.min(
          Math.max(180, viewportW * 0.23),
          230
        );
        const keypadW = Math.min(
          Math.max(150, w * 0.25),
          200
        );

        document.documentElement.style.setProperty(
          "--phone-header-w",
          `${headerW}px`
        );
        document.documentElement.style.setProperty(
          "--phone-keypad-w",
          `${keypadW}px`
        );

        const boardWrapEl = document.querySelector(".board-wrap");
        const boardWrapStyle = getComputedStyle(boardWrapEl);
        const boardPadX =
          parseFloat(boardWrapStyle.paddingLeft) +
          parseFloat(boardWrapStyle.paddingRight);
        const boardPadY =
          parseFloat(boardWrapStyle.paddingTop) +
          parseFloat(boardWrapStyle.paddingBottom);

        boardW = Math.max(0, w - keypadW - 8 - boardPadX - 4);
        boardH = Math.max(0, h - boardPadY - 6);

        // 3列×4行テンキー
        keyH = Math.min(
          Math.max((h - 21) / 4, 28),
          58
        );
      } else if (landscape) {
        // タブレット等の横向きは従来どおり左右配置。
        const sideSpace = 40;
        const innerGap = 14;

        const keypadW = Math.min(
          Math.max(190, w * 0.27),
          300
        );

        document.documentElement.style.setProperty("--keypad-w", `${keypadW}px`);

        boardW = Math.max(0, w - keypadW - innerGap - sideSpace);
        boardH = Math.max(0, h - 18);

        keyH = Math.min(
          Math.max((boardH - 21) / 4, 32),
          72
        );
      } else {
        // 縦向きは
        // ヘッダー / 盤面 / 小余白 / テンキー / 下余白
        // となるよう盤面を少し控えめにする。
        keyH = Math.min(
          Math.max(h * 0.105, 38),
          60
        );

        const keypadH = keyH * 2 + 7;
        const gap = 12;
        const bottomSpace = 10;

        boardW = Math.max(0, w * 0.96);
        boardH = Math.max(0, h - keypadH - gap - bottomSpace - 8);
      }

      const cell = Math.max(
        16,
        Math.min(
          boardW / cells,
          boardH / cells,
          108
        )
      );

      document.documentElement.style.setProperty("--cell", `${cell}px`);
      document.documentElement.style.setProperty("--key-h", `${keyH}px`);
    }

    function scheduleLayout() {
      requestAnimationFrame(layout);
      setTimeout(layout, 60);
      setTimeout(layout, 180);
    }

    keypad.addEventListener("pointerdown", event => {
      const button = event.target.closest("button[data-key]");
      if (!button || button.disabled) return;

      event.preventDefault();

      const key = button.dataset.key;
      if (key === "delete") {
        deleteDigit();
      } else {
        appendDigit(key);
      }
    });

    playerSelect.addEventListener("change", () => {
      selectPlayer(playerSelect.value);
    });

    addPlayerBtn.addEventListener("click", openNameModal);
    cancelNameBtn.addEventListener("click", closeNameModal);
    saveNameBtn.addEventListener("click", registerPlayer);

    newPlayerName.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        registerPlayer();
      } else if (event.key === "Escape") {
        closeNameModal();
      }
    });

    nameModal.addEventListener("pointerdown", event => {
      if (event.target === nameModal) closeNameModal();
    });

    playerManageList.addEventListener("click", event => {
      const choose = event.target.closest("[data-player-name]");
      if (choose) {
        selectPlayer(choose.dataset.playerName);
        return;
      }

      const del = event.target.closest("[data-delete-player]");
      if (del && !del.disabled) {
        deletePlayer(del.dataset.deletePlayer);
      }
    });

    recordsBtn.addEventListener("click", openRecordsModal);
    closeRecordsBtn.addEventListener("click", closeRecordsModal);

    recordsModal.addEventListener("pointerdown", event => {
      if (event.target === recordsModal) closeRecordsModal();
    });

    historyList.addEventListener("click", event => {
      const btn = event.target.closest("[data-record-id]");
      if (!btn) return;

      appData.records = appData.records.filter(
        record => record.id !== btn.dataset.recordId
      );
      saveAppData();
      renderRecordsModal();

      if (!running && !countingDown) {
        statusEl.textContent =
          `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
      }
    });

    clearRecordsBtn.addEventListener("click", () => {
      const conditionRecords = currentConditionRecords();
      if (!conditionRecords.length) return;

      if (!confirm("この条件の記録をすべて消しますか？")) return;

      appData.records = appData.records.filter(record => !conditionMatches(record));
      appData.bestRecords = appData.bestRecords.filter(
        record => !conditionMatches(record)
      );
      saveAppData();
      renderRecordsModal();

      if (!running && !countingDown) {
        statusEl.textContent =
          `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
      }
    });

    startBtn.addEventListener("click", startGame);
    pauseBtn.addEventListener("click", togglePause);

    operationEl.addEventListener("change", () => {
      if (running) {
        startGame();
      } else {
        const size = Number(gridSizeEl.value);
        rowNumbers = createHeaders(size);
        colNumbers = createHeaders(size);
        correctCount = 0;
        buildBoard();
        statusEl.textContent =
        `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
      }
    });

    gridSizeEl.addEventListener("change", () => {
      resetGame();
    });

    window.addEventListener("resize", scheduleLayout);
    window.addEventListener("orientationchange", scheduleLayout);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleLayout);
    }

    {
      const size = Number(gridSizeEl.value);
      rowNumbers = createHeaders(size);
      colNumbers = createHeaders(size);
      renderPlayerSelect();
      buildBoard();
      setKeypadEnabled(false);
      setPlayerControlsEnabled(true);
      statusEl.textContent =
        `「スタート」を押してください　${currentPlayerName()}${bestLabel()}`;
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => {
          console.error("Service Worker registration failed:", error);
        });
      });
    }
  </script>

</body>
</html>
